<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#1C1C1E">
<title>Финансы</title>
<style>
:root{--bg:#1C1C1E;--card:#2C2C2E;--yellow:#FFDD2D;--text:#FFFFFF;--muted:#8E8E93;--green:#30D158;--red:#FF453A;--line:#3A3A3C}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Roboto,Arial,sans-serif;min-height:100vh;padding-bottom:70px;font-size:15px}
.wrap{max-width:640px;margin:0 auto;padding:16px}

/* Header */
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
h1{font-size:24px;font-weight:700;letter-spacing:-0.5px}
.tools button{background:var(--card);border:none;color:var(--muted);width:36px;height:36px;border-radius:10px;font-size:16px;margin-left:8px}

/* Balance Card */
.balance-card{background:var(--yellow);color:#000;border-radius:16px;padding:20px;margin-bottom:16px}
.balance-label{font-size:13px;font-weight:600;opacity:0.7;text-transform:uppercase;letter-spacing:0.5px}
.balance-sum{font-size:34px;font-weight:800;margin-top:4px;font-variant-numeric:tabular-nums;line-height:1.1}

/* Tabs Content */
.tab-content{display:none}
.tab-content.active{display:block}

/* Form */
.form-card{background:var(--card);border-radius:16px;padding:16px;margin-bottom:16px}
.toggle{display:flex;background:var(--bg);border-radius:12px;padding:3px;margin-bottom:14px}
.toggle button{flex:1;border:none;background:transparent;color:var(--muted);padding:10px;border-radius:10px;font-size:14px;font-weight:600;transition:all .2s}
.toggle button.on-out{background:rgba(255,69,58,.2);color:var(--red)}
.toggle button.on-in{background:rgba(48,209,88,.2);color:var(--green)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
input,select{background:var(--bg);border:1px solid var(--line);border-radius:12px;color:var(--text);padding:14px;font-size:16px;width:100%;outline:none}
input:focus,select:focus{border-color:var(--yellow)}
.add-btn{background:var(--yellow);color:#000;border:none;border-radius:12px;padding:14px;font-size:16px;font-weight:700;width:100%;margin-top:4px}

/* List */
.section-title{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:0.8px;margin:20px 0 10px;font-weight:600}
.list{background:var(--card);border-radius:16px;overflow:hidden}
.item{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:none}
.ico{width:40px;height:40px;background:var(--bg);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.info{flex:1;min-width:0}
.info-name{font-weight:600;font-size:15px}
.info-date{font-size:12px;color:var(--muted);margin-top:2px}
.amt{font-weight:700;font-size:15px;font-variant-numeric:tabular-nums;white-space:nowrap}
.green{color:var(--green)}.red{color:var(--red)}
.del{border:none;background:transparent;color:var(--muted);font-size:20px;padding:4px 0 4px 8px}
.empty{color:var(--muted);text-align:center;padding:30px 16px;font-size:14px}

/* Analytics Tab */
.month-picker{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 16px;color:var(--text);font-size:15px;width:100%;margin-bottom:16px;text-align:center}
.passive-card{background:var(--card);border-radius:16px;padding:16px;margin-bottom:16px}
.passive-header{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px}
.passive-sum{font-size:22px;font-weight:700;color:var(--green)}
.passive-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.passive-row:last-child{border-bottom:none}
.passive-row span:last-child{font-weight:600;font-variant-numeric:tabular-nums}

/* Chart */
.chart-card{background:var(--card);border-radius:16px;padding:16px;margin-bottom:16px}
.chart-title{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:0.8px;margin-bottom:12px;font-weight:600}
svg{width:100%;height:auto;display:block}
.chart-line{fill:none;stroke:var(--yellow);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.chart-area{fill:url(#grad)}
.chart-dot{fill:var(--yellow);stroke:var(--card);stroke-width:2}
.chart-label{fill:var(--muted);font-size:10px;font-family:inherit}
.chart-val{fill:var(--text);font-size:10px;font-weight:600;font-family:inherit}
.no-data-chart{color:var(--muted);text-align:center;padding:40px 0;font-size:14px}

/* Bottom Nav */
.nav{position:fixed;bottom:0;left:0;right:0;background:rgba(28,28,30,.95);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--line);display:flex;z-index:100;padding-bottom:env(safe-area-inset-bottom)}
.nav button{flex:1;border:none;background:transparent;color:var(--muted);padding:10px 0 8px;font-size:10px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:4px;transition:color .2s}
.nav button.active{color:var(--yellow)}
.nav button svg{width:24px;height:24px;fill:currentColor}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>💰 Финансы</h1>
    <div style="display:flex">
      <button onclick="exportData()" title="Экспорт">⬇</button>
      <button onclick="document.getElementById('file').click()" title="Импорт">⬆</button>
      <input type="file" id="file" accept=".json" hidden onchange="importData(this)">
    </div>
  </header>

  <!-- TAB 1: OPERATIONS -->
  <div id="tab-ops" class="tab-content active">
    <div class="balance-card">
      <div class="balance-label">Общий баланс</div>
      <div id="balance" class="balance-sum">0 ₽</div>
    </div>

    <div class="form-card">
      <div class="toggle">
        <button type="button" id="tOut" class="on-out">Расход</button>
        <button type="button" id="tIn">Доход</button>
      </div>
      <div class="row">
        <input id="amount" inputmode="decimal" placeholder="Сумма, ₽">
        <input id="date" type="date">
      </div>
      <select id="cat"></select>
      <input id="note" placeholder="Заметка (необязательно)" style="margin-top:10px">
      <button class="add-btn" onclick="addTx()">Добавить</button>
    </div>

    <div class="section-title">Последние операции</div>
    <div class="list" id="list"></div>
  </div>

  <!-- TAB 2: ANALYTICS -->
  <div id="tab-analytics" class="tab-content">
    <input type="month" id="month" class="month-picker">

    <div class="passive-card">
      <div class="passive-header">
        <span style="color:var(--muted);font-size:13px;text-transform:uppercase;letter-spacing:.5px;font-weight:600">Пассивный доход</span>
        <span id="passive-total" class="passive-sum">0 ₽</span>
      </div>
      <div id="passive-list"></div>
    </div>

    <div class="chart-card">
      <div class="chart-title">Рост капитала по месяцам</div>
      <div id="chart-container"></div>
    </div>
  </div>
</div>

<!-- BOTTOM NAVIGATION -->
<nav class="nav">
  <button class="active" onclick="switchTab('ops',this)">
    <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V5h14v14zM7 10h2v7H7zm4-3h2v10h-2zm4 6h2v4h-2z"/></svg>
    Операции
  </button>
  <button onclick="switchTab('analytics',this)">
    <svg viewBox="0 0 24 24"><path d="M3.5 18.49l6-6.01 4 4L22 6.92l-1.41-1.41-7.09 7.97-4-4L2 16.99z"/></svg>
    Аналитика
  </button>
</nav>

<script>
const CATS = {
  in: {'Зарплата':'💼','Купоны облигаций':'🏦','Дивиденды':'📈','Проценты и вклады':'🪙','Продажа бумаг':'📊','Прочий доход':'➕'},
  out: {'Продукты':'🛒','Жильё и ЖКХ':'🏠','Транспорт':'🚌','Связь':'📱','Кафе':'🍔','Развлечения':'🎬','Здоровье':'💊','Одежда':'👕','Покупка бумаг':'📥','Прочее':'📦'}
};
const PASSIVE_CATS = ['Купоны облигаций','Дивиденды','Проценты и вклады'];
let data = JSON.parse(localStorage.getItem('fin_v2') || '[]');
let type = 'out';

const $ = id => document.getElementById(id);
const fmt = n => new Intl.NumberFormat('ru-RU',{maximumFractionDigits:2}).format(n) + ' ₽';
const today = () => new Date().toISOString().slice(0,10);

function save() { localStorage.setItem('fin_v2', JSON.stringify(data)); }

// --- Type Toggle ---
function setType(t) {
  type = t;
  $('tOut').className = t==='out' ? 'on-out' : '';
  $('tIn').className = t==='in' ? 'on-in' : '';
  $('cat').innerHTML = Object.keys(CATS[t]).map(c => `<option>${c}</option>`).join('');
}
$('tOut').onclick = () => setType('out');
$('tIn').onclick = () => setType('in');

// --- Add Transaction ---
function addTx() {
  const v = parseFloat($('amount').value.replace(',','.').replace(/\s/g,''));
  if (!v || v <= 0) return alert('Введите корректную сумму');
  data.push({
    id: Date.now(),
    type,
    cat: $('cat').value,
    amount: v,
    date: $('date').value || today(),
    note: $('note').value.trim()
  });
  save();
  renderAll();
  $('amount').value = '';
  $('note').value = '';
}

function del(id) {
  data = data.filter(x => x.id !== id);
  save();
  renderAll();
}

// --- Tab Switching ---
function switchTab(tab, btn) {
  document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.nav button').forEach(el => el.classList.remove('active'));
  $('tab-' + tab).classList.add('active');
  btn.classList.add('active');
  if (tab === 'analytics') renderAnalytics();
}

// --- Render Operations Tab ---
function renderOps() {
  const bal = data.reduce((s,x) => s + (x.type==='in' ? x.amount : -x.amount), 0);
  $('balance').textContent = fmt(bal);

  const sorted = [...data].sort((a,b) => b.date.localeCompare(a.date) || b.id - a.id).slice(0, 50);
  $('list').innerHTML = sorted.length ? sorted.map(x =>
    `<div class="item">
      <div class="ico">${CATS[x.type][x.cat] || '•'}</div>
      <div class="info">
        <div class="info-name">${x.cat}</div>
        <div class="info-date">${x.date.split('-').reverse().slice(0,2).join('.')}${x.note ? ' · '+x.note : ''}</div>
      </div>
      <div class="amt ${x.type==='in'?'green':'red'}">${x.type==='in'?'+':'−'}${fmt(x.amount)}</div>
      <button class="del" onclick="del(${x.id})">×</button>
    </div>`
  ).join('') : '<div class="empty">Нет операций. Добавьте первую!</div>';
}

// --- Render Analytics Tab ---
function renderAnalytics() {
  const md = $('month').value;
  const monthData = data.filter(x => x.date.startsWith(md));

  // Passive Income
  const passive = monthData.filter(x => x.type==='in' && PASSIVE_CATS.includes(x.cat));
  const passiveTotal = passive.reduce((s,x) => s + x.amount, 0);
  $('passive-total').textContent = '+' + fmt(passiveTotal);

  const passiveMap = {};
  passive.forEach(x => passiveMap[x.cat] = (passiveMap[x.cat]||0) + x.amount);
  const passiveEntries = Object.entries(passiveMap).sort((a,b) => b[1]-a[1]);

  $('passive-list').innerHTML = passiveEntries.length
    ? passiveEntries.map(([cat, val]) =>
        `<div class="passive-row">
          <span>${CATS.in[cat]||''} ${cat}</span>
          <span class="green">+${fmt(val)}</span>
        </div>`
      ).join('')
    : '<div style="color:var(--muted);font-size:13px;padding:8px 0">Нет пассивного дохода за этот месяц</div>';

  // Capital Growth Chart
  renderChart();
}

function renderChart() {
  const container = $('chart-container');
  if (data.length === 0) {
    container.innerHTML = '<div class="no-data-chart">Добавьте операции,<br>чтобы увидеть график</div>';
    return;
  }

  // Group by month, calculate cumulative balance
  const months = {};
  data.forEach(x => {
    const m = x.date.slice(0,7);
    if (!months[m]) months[m] = 0;
    months[m] += x.type==='in' ? x.amount : -x.amount;
  });

  const sortedMonths = Object.keys(months).sort();
  if (sortedMonths.length < 1) {
    container.innerHTML = '<div class="no-data-chart">Недостаточно данных</div>';
    return;
  }

  let cumulative = 0;
  const points = sortedMonths.map(m => {
    cumulative += months[m];
    return { month: m, value: cumulative };
  });

  // SVG Chart
  const W = 320, H = 160, PX = 35, PY = 20, PB = 25;
  const chartW = W - PX - 10, chartH = H - PY - PB;
  const vals = points.map(p => p.value);
  const minV = Math.min(...vals, 0);
  const maxV = Math.max(...vals, 1);
  const range = maxV - minV || 1;

  const getX = i => PX + (i / Math.max(points.length-1, 1)) * chartW;
  const getY = v => PY + chartH - ((v - minV) / range) * chartH;

  const pathD = points.map((p,i) => `${i===0?'M':'L'}${getX(i).toFixed(1)},${getY(p.value).toFixed(1)}`).join(' ');
  const areaD = pathD + ` L${getX(points.length-1).toFixed(1)},${PY+chartH} L${PX},${PY+chartH} Z`;

  const dots = points.map((p,i) =>
    `<circle class="chart-dot" cx="${getX(i).toFixed(1)}" cy="${getY(p.value).toFixed(1)}" r="3.5"/>
     <text class="chart-val" x="${getX(i).toFixed(1)}" y="${getY(p.value).toFixed(1)-8}" text-anchor="middle">${(p.value/1000).toFixed(0)}k</text>
     <text class="chart-label" x="${getX(i).toFixed(1)}" y="${H-5}" text-anchor="middle">${p.month.slice(5)}</text>`
  ).join('');

  container.innerHTML = `
    <svg viewBox="0 0 ${W} ${H}">
      <defs><linearGradient id="grad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#FFDD2D" stop-opacity="0.3"/>
        <stop offset="100%" stop-color="#FFDD2D" stop-opacity="0"/>
      </linearGradient></defs>
      <path class="chart-area" d="${areaD}"/>
      <path class="chart-line" d="${pathD}"/>
      ${dots}
    </svg>`;
}

// --- Export / Import ---
function exportData() {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));
  a.download = 'finance-backup-' + today() + '.json';
  a.click();
}
function importData(inp) {
  const f = inp.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const arr = JSON.parse(r.result);
      if (!Array.isArray(arr)) throw 0;
      if (confirm(`Заменить данные? (${arr.length} записей)`)) {
        data = arr; save(); renderAll();
      }
    } catch(e) { alert('Ошибка: неверный файл'); }
  };
  r.readAsText(f); inp.value = '';
}

// --- Init ---
$('date').value = today();
$('month').value = today().slice(0,7);
$('month').onchange = renderAnalytics;
setType('out');
renderAll();

function renderAll() {
  renderOps();
  if ($('tab-analytics').classList.contains('active')) renderAnalytics();
}
</script>
</body>
</html>
