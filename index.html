function shrink(file){return new Promise(function(res,rej){var r=new FileReader();
r.onload=function(){var im=new Image();im.onload=function(){var k=Math.min(1,1200/Math.max(im.width,im.height));
var c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);
c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.82))};
im.onerror=rej;im.src=r.result};r.onerror=rej;r.readAsDataURL(file)})}

function confirmModal(ti,tx,fn,label){openModal('<h2>'+esc(ti)+'</h2><p class="msub">'+esc(tx)+'</p><div class="macts"><button class="btn gho" data-a="mclose">Отмена</button><button class="btn dan" id="ok">'+esc(label||'Удалить')+'</button></div>');
$('#ok').onclick=function(){closeModal();fn()}}
function ecoModal(){openModal('<h2>Экосистема VODOVSKY GROUP</h2><p class="msub">Один аккаунт · один дизайн · шесть продуктов. Строим поэтапно.</p><div class="eco">'+ECO.map(function(e){return'<div class="ecard"><div class="et"><em>'+e.e+'</em><b>'+e.n+'</b><span class="est '+(e.live?'live':'soon')+'">'+(e.live?'АКТИВНО':'СКОРО')+'</span></div><p>'+e.d+'</p></div>'}).join('')+'</div><p class="msub" style="text-align:center;margin:16px 0 0">VODOVSKY GROUP · цифровая экосистема на базе ИИ</p>')}
function openDrawer(type,id){U.drawer={type:type,id:id};var h='';
if(type==='tx'){var t=S.transactions.filter(function(x){return x.id===id})[0];if(!t){closeDrawer();return}
var c=CM[t.category]||CM.other;
h='<div class="dh"><b>Операция</b><button class="ib" data-a="dclose">'+ic('x',16)+'</button></div><div class="db"><span class="tic" style="background:'+ha(c.c,.15)+';width:56px;height:56px;font-size:26px;border-radius:18px">'+c.e+'</span><div class="damt '+(t.type==='income'?'in':'out')+'">'+(t.type==='income'?'+':'−')+' '+fmt(t.amount)+'</div><div style="margin-top:8px"><span class="bdg '+(t.type==='income'?'paid':'over')+'">'+(t.type==='income'?'ДОХОД':'РАСХОД')+'</span></div><div class="drows"><div class="dr"><span>Категория</span><b>'+c.e+' '+c.n+'</b></div><div class="dr"><span>Дата</span><b>'+fdf(t.date)+'</b></div><div class="dr"><span>Записано</span><b>'+rel(t.date)+'</b></div></div>'+(t.note?'<div class="dnote">'+esc(t.note)+'</div>':'')+'</div><div class="df"><button class="btn gho" data-a="dup" data-id="'+t.id+'">'+ic('copy',15)+' Дубль</button><button class="btn pri" data-a="edittx" data-id="'+t.id+'">'+ic('edit',15)+' Изменить</button><button class="btn dan" data-a="deltx" data-id="'+t.id+'">'+ic('trash',15)+'</button></div>'}
else{var g=S.goals.filter(function(x){return x.id===id})[0];if(!g){closeDrawer();return}var p=pct(g);
h='<div class="dh"><b>Цель</b><button class="ib" data-a="dclose">'+ic('x',16)+'</button></div><div class="db"><div class="dcov"><img src="'+(g.photo||cover('#3B4BDB','#5AA2FF','🎯'))+'" alt="'+esc(g.title)+'"></div><h2 style="font-size:20px;font-weight:800">'+esc(g.title)+'</h2><div style="display:flex;align-items:center;gap:16px;margin:14px 0"><div style="position:relative;width:86px;height:86px;flex:none"><svg width="86" height="86" viewBox="0 0 86 86" style="transform:rotate(-90deg)"><circle cx="43" cy="43" r="36" fill="none" stroke="var(--line)" stroke-width="9"/><circle cx="43" cy="43" r="36" fill="none" stroke="'+(p>=100?'var(--green)':'var(--brand)')+'" stroke-width="9" stroke-linecap="round" stroke-dasharray="'+(p*2.262)+' 226.2"/></svg><b style="position:absolute;inset:0;display:grid;place-items:center;font-size:16px">'+Math.round(p)+'%</b></div><div><div style="font-size:24px;font-weight:800">'+fmt(g.saved)+'</div><div style="font-size:12.5px;font-weight:600;color:var(--muted)">из '+fmt(g.target)+' · осталось '+fmt(Math.max(g.target-g.saved,0))+'</div></div></div><div class="bar'+(p>=100?' g':'')+'"><i style="width:'+p+'%"></i></div><div class="drows" style="margin-top:16px"><div class="dr"><span>Создана</span><b>'+fd(iso(new Date(g.createdAt)))+'</b></div><div class="dr"><span>Статус</span><b>'+(p>=100?'✓ Достигнута':'В процессе')+'</b></div></div></div><div class="df"><button class="btn pri" data-a="fund" data-id="'+g.id+'"'+(p>=100?' disabled':'')+'>'+ic('plus',15)+' Пополнить</button><button class="btn gho" data-a="editgoal" data-id="'+g.id+'">'+ic('edit',15)+'</button><button class="btn dan" data-a="delgoal" data-id="'+g.id+'">'+ic('trash',15)+'</button></div>'}
$('#drawer').innerHTML='<div class="dov"><div class="scrim" data-a="dclose"></div><div class="drawer">'+h+'</div></div>'}
function closeDrawer(){U.drawer=null;$('#drawer').innerHTML=''}
function exportData(){var b=new Blob([JSON.stringify(S,null,2)],{type:'application/json'}),a=document.createElement('a');
a.href=URL.createObjectURL(b);a.download='vodovsky-money-'+tiso()+'.json';a.click();
setTimeout(function(){URL.revokeObjectURL(a.href)},2000);toast('Резервная копия скачана','💾')}
$('#imp').addEventListener('change',function(){var f=$('#imp').files[0];if(!f)return;var r=new FileReader();
r.onload=function(){try{var d=JSON.parse(r.result);
if(!Array.isArray(d.transactions)||!Array.isArray(d.goals)||!Array.isArray(d.payments))throw 0;
var snap=JSON.stringify(S);S=d;S.views=d.views||[];S.settings=Object.assign({theme:'dark',banner:true},d.settings);
U.sel=[];save();theme();render();
toast('Данные загружены','📥',function(){S=JSON.parse(snap);save();theme();render();toast('Импорт отменён','↩️')})}
catch(e){toast('Файл не похож на копию VODOVSKY','⚠️')}$('#imp').value=''};
r.readAsText(f)});
document.addEventListener('click',function(e){var menu=$('#menu');
if(menu&&!menu.hidden&&!e.target.closest('.mwrap'))menu.hidden=true;
var el=e.target.closest('[data-a]');if(!el)return;
var a=el.dataset.a,id=el.dataset.id;
if(a==='sel')return;
if(a==='nav'){U.sec=el.dataset.s;U.sel=[];closeDrawer();render();window.scrollTo({top:0,behavior:'smooth'})}
else if(a==='theme'){S.settings.theme=S.settings.theme==='light'?'dark':'light';save();theme();render()}
else if(a==='menu')menu.hidden=!menu.hidden;
else if(a==='export'){menu.hidden=true;exportData()}
else if(a==='import'){menu.hidden=true;$('#imp').click()}
else if(a==='wipe'){menu.hidden=true;confirmModal('Очистить все данные?','Все операции, цели и выплаты будут удалены. Сразу после удаления можно нажать «Отменить».',function(){var snap=JSON.stringify(S);S.transactions=[];S.goals=[];S.payments=[];S.views=[];U.sel=[];save();render();toast('Все данные очищены','🧹',function(){S=JSON.parse(snap);save();render();toast('Данные восстановлены','↩️')})},'Очистить всё')}
else if(a==='eco'){if(menu)menu.hidden=true;ecoModal()}
else if(a==='nobanner'){S.settings.banner=false;save();render()}
else if(a==='newtx')txModal();
else if(a==='edittx')txModal(id);
else if(a==='opentx')openDrawer('tx',id);
else if(a==='dup'){var t=S.transactions.filter(function(x){return x.id===id})[0];
if(t){S.transactions.unshift(Object.assign({},t,{id:uid(),date:tiso(),createdAt:Date.now()}));save();closeDrawer();render();toast('Операция продублирована','📋')}}
else if(a==='deltx')delTx([id]);
else if(a==='bulkdel'){var ids=U.sel.slice();confirmModal('Удалить операции ('+ids.length+')?','Их можно вернуть кнопкой «Отменить».',function(){delTx(ids)})}
else if(a==='bulkclear'){U.sel=[];txList()}
else if(a==='ftype'){U.f.type=el.dataset.v;U.f.cat='all';U.view=null;render()}
else if(a==='saveview')viewModal();
else if(a==='delview'){S.views=S.views.filter(function(x){return x.id!==U.view});U.view=null;save();render();toast('Вид удалён','🗑️')}
else if(a==='days'){U.days=parseInt(el.dataset.d,10);render()}
else if(a==='newgoal')goalModal();
else if(a==='editgoal')goalModal(id);
else if(a==='opengoal')openDrawer('goal',id);
else if(a==='fund'){e.stopPropagation();fundModal(id)}
else if(a==='delgoal'){var g=S.goals.filter(function(x){return x.id===id})[0];if(!g)return;
var gi=S.goals.indexOf(g);S.goals.splice(gi,1);save();closeDrawer();render();
toast('Цель «'+g.title+'» удалена','🗑️',function(){S.goals.splice(Math.min(gi,S.goals.length),0,g);save();render();toast('Цель восстановлена','↩️')})}
else if(a==='newpay')payModal();
else if(a==='editpay')payModal(id);
else if(a==='paynow')payNow(id);
else if(a==='delpay'){var p=S.payments.filter(function(x){return x.id===id})[0];if(!p)return;
var pi=S.payments.indexOf(p);S.payments.splice(pi,1);save();render();
toast('Выплата «'+p.title+'» удалена','🗑️',function(){S.payments.splice(Math.min(pi,S.payments.length),0,p);save();render();toast('Выплата восстановлена','↩️')})}
else if(a==='mclose')closeModal();
else if(a==='dclose')closeDrawer();
else if(a==='undo'){var fn=UNDO[id];if(fn){delete UNDO[id];fn()}var tt=$('#t'+id);if(tt)tt.remove()}
else if(a==='tclose'){var t2=$('#t'+id);if(t2)t2.remove();delete UNDO[id]}});
document.addEventListener('change',function(e){var el=e.target,a=el.dataset.a;
if(a==='sel'){var i=U.sel.indexOf(el.dataset.id);
if(el.checked&&i<0)U.sel.push(el.dataset.id);if(!el.checked&&i>=0)U.sel.splice(i,1);txList()}
if(a==='toggle'){var p=S.payments.filter(function(x){return x.id===el.dataset.id})[0];
if(p){p.active=el.checked;save();render();toast(p.active?'Выплата включена':'Выплата на паузе',p.active?'▶️':'⏸️')}}});
document.addEventListener('keydown',function(e){
if(e.key==='Escape'){if($('#modal').innerHTML)closeModal();else if(U.drawer)closeDrawer();else $('#menu').hidden=true}});
var dragId=null;
document.addEventListener('dragstart',function(e){var r=e.target.closest('[data-drag]');if(!r)return;
dragId=r.dataset.drag;r.classList.add('drag');e.dataTransfer.effectAllowed='move';
try{e.dataTransfer.setData('text/plain',dragId)}catch(x){}});
document.addEventListener('dragend',function(){dragId=null;$$('.trow').forEach(function(r){r.classList.remove('drag','above','below')})});
document.addEventListener('dragover',function(e){var r=e.target.closest('[data-drag]');if(!r||!dragId||r.dataset.drag===dragId)return;
e.preventDefault();var b=r.getBoundingClientRect();
$$('.trow').forEach(function(x){x.classList.remove('above','below')});
r.classList.add(e.clientY<b.top+b.height/2?'above':'below')});
document.addEventListener('drop',function(e){var r=e.target.closest('[data-drag]');if(!r||!dragId)return;e.preventDefault();
var from=S.transactions.findIndex(function(t){return t.id===dragId});if(from<0)return;
var b=r.getBoundingClientRect(),before=e.clientY<b.top+b.height/2,item=S.transactions.splice(from,1)[0];
var to=S.transactions.findIndex(function(t){return t.id===r.dataset.drag});if(!before)to++;
S.transactions.splice(to,0,item);save();txList();toast('Порядок обновлён','↕')});
theme();render();
</script>
</body>
